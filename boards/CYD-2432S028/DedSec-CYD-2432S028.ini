; Local customization of the standard resistive CYD. Inherits the actual Bruce
; drivers, pins, dependencies and custom_4Mb_full.csv without changing other boards.
[env:DedSec-CYD-2432S028]
extends = env:CYD-2432S028
build_flags =
    ${env:CYD-2432S028.build_flags}
    -DDEDSEC_OS=1
extra_scripts =
    ${env.extra_scripts}
    post:tools/dedsec/check_partition.py
